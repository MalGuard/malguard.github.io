name: Validate production site

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate required production files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            index.html
            tools.html
            trust.html
            privacy.html
            support.html
            about.html
            labs.html
            docs.html
            download.html
            scan-mods.html
            ai-intelligence.html
            malware-ai.html
            malware-ai-windows.html
            threat-radar.html
            scan-url.html
            products.html
            gta-guard.html
            sandbox-help.html
            app.html
            gamescam-guard-android.html
            404.html
            robots.txt
            sitemap.xml
            release/gta-guard-windows.json
            data/product-status.json
            .well-known/security.txt
            assets/site-pages.css
            assets/page-history.js
            research/repackaged-mod.html
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing required file: $file"; exit 1; }
          done

      - name: Validate MalGuard AI without live providers or deployment
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run test:ai
          npm run check:ai
          TEST_CHROMIUM_EXECUTABLE=/usr/bin/google-chrome npm run test:ai:browser
          TEST_CHROMIUM_EXECUTABLE=/usr/bin/google-chrome npm run test:ai:local
          TEST_CHROMIUM_EXECUTABLE=/usr/bin/google-chrome npm run test:ai:builder
          TEST_CHROMIUM_EXECUTABLE=/usr/bin/google-chrome node tests/malguard-ai-account.mjs
          TEST_CHROMIUM_EXECUTABLE=/usr/bin/google-chrome node tests/malguard-ai-library.mjs

      - name: Validate email authentication with synthetic accounts
        run: node --test services/game-scam-guard/server/ai-library.test.js services/game-scam-guard/server/email-auth.test.js services/game-scam-guard/src/email-account.test.js

      - name: Validate download cancellation and integrity using synthetic bytes
        run: node --test tests/public-release/cancellation.test.mjs tests/public-release/model.test.mjs

      - name: Validate trust and product claims
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/validate-trust.py

      - name: Validate production deploy boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q "path: '_site'" .github/workflows/static.yml
          if grep -q "path: '\.'" .github/workflows/static.yml; then
            echo "Pages workflow must not upload the entire repository."
            exit 1
          fi
          grep -q "test ! -e _site/agent-runtime-test-v1" .github/workflows/static.yml
          grep -q "test ! -e _site/malware-ai-preview-v02" .github/workflows/static.yml
