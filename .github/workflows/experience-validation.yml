name: Validate MalGuard experience
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  responsive-and-functional:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Match package-lock.json; browsers and OS libraries are already installed.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate source and install pinned test tooling
        run: |
          python3 tests/validate-site.py
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          node tests/public-release/browser.cjs
          npm run test:game-scam-guard
          node --check assets/precision/shared-typing.js
          node --check assets/malguard-unified.js
          node --check assets/fusion/home-sections.js
          node --check assets/contextual-header.js
          node --check assets/experience.js
          node --check assets/brand-motion.js
          node --check assets/site-entry.js
          node --check assets/i18n.mjs
          node --check assets/public-release.mjs
          node tests/public-release/model.test.mjs
          node --test private-download-service/tests/*.test.mjs
      - name: Check responsive pages and benign interactions
        run: |
          # Match production HTTPS: WebKit correctly upgrades HTTP subresources
          # when an existing page declares upgrade-insecure-requests.
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/malguard-test.key -out /tmp/malguard-test.crt -days 1 -subj '/CN=127.0.0.1' -addext 'subjectAltName=IP:127.0.0.1' 2>/dev/null
          python3 tests/serve-https.py > /tmp/malguard-site-test.log 2>&1 &
          TEST_BROWSER=webkit xvfb-run --auto-servernum node tests/secure-cinematic.mjs
          TEST_BROWSER=chromium node tests/secure-cinematic.mjs
          node tests/precision-pages-qa.mjs
          npm run test:experience
          TEST_BROWSER=chromium node tests/game-scam-preview.mjs
          node tests/game-scam-extended-flow.mjs
          node tests/game-scam-learning.mjs
          node tests/game-scam-isolation.mjs
          # Use the same display compositor as cinematic WebKit checks.
          xvfb-run --auto-servernum node tests/secure-forms.mjs
          node tests/public-release/locale-pages.mjs
      - name: Save screenshots and verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: malguard-experience-verification
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
  # Independent of the public download tests: a failure there must not hide
  # homepage typewriter and responsive-navigation regressions.
  coding-typing-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify viewport typing, menus and reduced-motion fallback
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/malguard-test.key -out /tmp/malguard-test.crt -days 1 -subj '/CN=127.0.0.1' -addext 'subjectAltName=IP:127.0.0.1' 2>/dev/null
          python3 tests/serve-https.py > /tmp/malguard-site-test.log 2>&1 &
          TEST_BROWSER=chromium node tests/precision-motion-matrix.mjs
          TEST_BROWSER=webkit xvfb-run --auto-servernum node tests/precision-motion-matrix.mjs
          TEST_BROWSER=chromium node tests/precision-shared-typing.mjs
          TEST_BROWSER=webkit xvfb-run --auto-servernum node tests/precision-shared-typing.mjs
          TEST_BROWSER=chromium node tests/gta6-shared-experience.mjs
          TEST_BROWSER=webkit xvfb-run --auto-servernum node tests/gta6-shared-experience.mjs

  cinematic:
    needs: responsive-and-functional
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned verification tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify complete cinematic and failure matrix
        env:
          TEST_BROWSER: ${{ matrix.browser }}
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/malguard-test.key -out /tmp/malguard-test.crt -days 1 -subj '/CN=127.0.0.1' -addext 'subjectAltName=IP:127.0.0.1' 2>/dev/null
          python3 tests/serve-https.py > /tmp/malguard-site-test.log 2>&1 &
          # WebKit 26.5's Linux WPE headless compositor crashes on the
          # full-motion card scene. Use its GTK display compositor under
          # Xvfb; keep the same engine, effects and complete test matrix.
          if [ "$TEST_BROWSER" = "webkit" ]; then
            xvfb-run --auto-servernum npm run test:motion
          else
            npm run test:motion
          fi
      - name: Verify particle text assembly, reverse scroll and readable holds
        env:
          TEST_BROWSER: ${{ matrix.browser }}
        run: |
          if [ "$TEST_BROWSER" = "webkit" ]; then
            xvfb-run --auto-servernum node tests/precision-home-qa.mjs
          else
            node tests/precision-home-qa.mjs
          fi
      - name: Capture desktop and mobile visual review
        if: matrix.browser == 'chromium'
        run: node tests/visual-review.mjs
      - name: Save cinematic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: malguard-cinematic-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
