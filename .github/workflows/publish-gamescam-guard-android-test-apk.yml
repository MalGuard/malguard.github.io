name: Publish GameScam Guard Android test APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-test-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gamescam-guard-android
    env:
      RELEASE_TAG: gamescam-guard-android-v1.0.0
      RELEASE_ASSET: GameScam-Guard-1.0.0-android-debug.apk
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          printf 'sdk.dir=%s\n' "$sdk_root" > local.properties
      - name: Build installable test APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Publish direct-download release asset
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "GameScam Guard Android 1.0.0 (test APK)" --prerelease --notes "Installable Android 8.0+ test APK. This debug-signed build is for direct testing and is not a Play/Myket/Bazaar/Galaxy Store release."
          fi
          gh release upload "$RELEASE_TAG" "$apk#$RELEASE_ASSET" --clobber --repo "$GITHUB_REPOSITORY"
