name: Apply Future Glass UI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redesign:
    if: ${{ !contains(github.event.head_commit.message, 'Apply future glass UI') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply future typography and glass cards
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_fonts = '<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">'
          new_fonts = '<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700&family=Sora:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">'
          s = s.replace(old_fonts, new_fonts)
          s = s.replace('--display:"Orbitron",sans-serif;--body:"Rajdhani",sans-serif', '--display:"Sora",sans-serif;--body:"Space Grotesk",sans-serif;--product:"Oxanium",sans-serif')

          marker = '/* MALGUARD FUTURE GLASS UI */'
          if marker not in s:
              css = r'''<style>
          /* MALGUARD FUTURE GLASS UI */
          :root{
            --future-cyan:#6ee7ff;
            --future-blue:#4f8cff;
            --future-violet:#9b7cff;
            --future-white:#eef8ff;
            --glass:rgba(14,24,38,.48);
            --glass-line:rgba(160,225,255,.16);
          }
          body{
            background:
              radial-gradient(circle at 72% 8%,rgba(79,140,255,.13),transparent 28%),
              radial-gradient(circle at 18% 20%,rgba(155,124,255,.09),transparent 24%),
              radial-gradient(circle at 50% 65%,rgba(110,231,255,.045),transparent 35%),
              var(--bg);
          }
          .brand{font-family:"Sora",sans-serif;letter-spacing:.08em}
          .brand-word{font-weight:800}
          .brand-word small{font-family:"Space Grotesk",sans-serif;letter-spacing:.18em}
          h1,.section-title,.labs-panel h3,.download-panel h3,.product-page-header h1{font-family:"Sora",sans-serif}
          h1{font-weight:800;letter-spacing:-.065em}
          h1 span{
            background:linear-gradient(100deg,var(--future-cyan),#fff 45%,var(--future-violet));
            -webkit-background-clip:text;background-clip:text;color:transparent;
            text-shadow:none;
          }
          .eyebrow,.btn,.nav-links a,.section-label,.product-status,.product-link,.plan-label,.trust-number,.step-number,.scan-card-value{font-family:"Space Grotesk",sans-serif}
          .products-grid{align-items:stretch}
          .product-card{
            overflow:hidden;
            min-height:350px;
            border:1px solid var(--glass-line);
            background:
              linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.018) 45%,rgba(79,140,255,.035)),
              var(--glass);
            box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 20px 55px rgba(0,0,0,.24);
            backdrop-filter:blur(24px) saturate(145%);
            -webkit-backdrop-filter:blur(24px) saturate(145%);
          }
          .product-card:before{
            content:"";position:absolute;inset:0;pointer-events:none;
            background:linear-gradient(120deg,rgba(255,255,255,.13),transparent 22%,transparent 72%,rgba(110,231,255,.06));
          }
          .product-card.available{
            border-color:rgba(110,231,255,.30);
            box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 22px 70px rgba(41,122,255,.12);
          }
          .product-card.available:after{
            content:"";position:absolute;left:24px;right:24px;top:0;height:1px;
            background:linear-gradient(90deg,transparent,var(--future-cyan),var(--future-violet),transparent);
            opacity:.85;
          }
          .product-icon{
            width:58px;height:58px;border-radius:18px;
            background:linear-gradient(145deg,rgba(110,231,255,.11),rgba(155,124,255,.08));
            border:1px solid rgba(166,225,255,.20);
            box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 10px 30px rgba(0,0,0,.18);
          }
          .product-icon img{width:39px;height:43px;filter:drop-shadow(0 0 10px rgba(110,231,255,.35))}
          .product-card h3{
            position:relative;z-index:1;
            font-family:"Oxanium",sans-serif;
            font-weight:600;letter-spacing:.015em;
          }
          .product-card.available h3{
            background:linear-gradient(100deg,#f4fcff 0%,var(--future-cyan) 48%,#8b9dff 100%);
            -webkit-background-clip:text;background-clip:text;color:transparent;
          }
          .product-card p{position:relative;z-index:1;color:#9fb3c2}
          .product-status{z-index:2;color:#89a8ba}
          .product-card.available .product-status{color:#78edc2}
          .product-link{position:relative;z-index:2}
          .hero-visual{filter:drop-shadow(0 25px 70px rgba(38,118,255,.08))}
          .radar{border-color:rgba(110,231,255,.26);box-shadow:0 0 100px rgba(79,140,255,.10),inset 0 0 80px rgba(110,231,255,.035),0 0 0 1px rgba(0,0,0,.9)}
          .scan-card,.radar-node{
            background:rgba(7,15,25,.60);
            border-color:rgba(150,220,255,.17);
            box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 15px 35px rgba(0,0,0,.18);
            backdrop-filter:blur(20px) saturate(140%);
            -webkit-backdrop-filter:blur(20px) saturate(140%);
          }
          .section-title{font-weight:700}
          .btn-primary{background:linear-gradient(100deg,#67e8f9,#78a7ff);color:#03101a;border:0;box-shadow:0 12px 35px rgba(78,157,255,.18)}
          .btn-secondary{background:rgba(255,255,255,.035);border-color:rgba(160,225,255,.15);backdrop-filter:blur(12px)}
          @media(max-width:700px){.product-card{min-height:320px}}
          </style>'''
              s = s.replace('</head>', css + '</head>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Apply future glass UI'
          git push
