name: Install refined MalGuard logo layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-refined-logo.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply refined logo layout
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_brand = '<a href="#home" class="brand" onclick="showHome()" aria-label="MalGuard home"><img class="brand-mark" src="assets/malguard-logo.svg" alt="MalGuard logo"><span class="brand-word">MALGUARD<small>GAMING SECURITY</small></span></a>'
          new_brand = '<a href="#home" class="brand" onclick="showHome()" aria-label="MalGuard home"><img class="brand-site-logo" src="assets/malguard-site-logo.svg" alt="MalGuard"></a>'
          if old_brand in s:
              s = s.replace(old_brand, new_brand, 1)
          elif 'class="brand-site-logo"' not in s:
              s = s.replace('<img class="brand-mark" src="assets/malguard-logo.svg" alt="MalGuard logo">', '<img class="brand-site-logo" src="assets/malguard-site-logo.svg" alt="MalGuard">', 1)
              s = s.replace('<span class="brand-word">MALGUARD<small>GAMING SECURITY</small></span>', '', 1)

          if 'rel="icon"' not in s:
              s = s.replace('<title>MalGuard | Scan Smart. Play Safe.</title>', '<title>MalGuard | Scan Smart. Play Safe.</title>\n<link rel="icon" type="image/svg+xml" href="assets/malguard-logo.svg">', 1)

          marker = '/* MALGUARD REFINED LOGO FIT */'
          if marker not in s:
              css = '''<style>
          /* MALGUARD REFINED LOGO FIT */
          .brand{gap:0}
          .brand-site-logo{display:block;height:40px;width:auto;object-fit:contain;filter:drop-shadow(0 0 10px rgba(0,189,244,.16))}
          .hero-logo{width:190px;height:190px;object-fit:contain;filter:drop-shadow(0 0 5px #000) drop-shadow(0 0 24px rgba(0,189,244,.30))}
          .product-icon{width:52px;height:52px;border-radius:14px;background:rgba(0,189,244,.055);border-color:rgba(0,189,244,.16)}
          .product-icon img{width:40px;height:40px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(0,189,244,.30))}
          .product-brand-logo{width:92px;height:92px;object-fit:contain;display:block;margin-bottom:18px;filter:drop-shadow(0 0 16px rgba(0,189,244,.24))}
          @media(max-width:760px){.brand-site-logo{height:35px}.hero-logo{width:150px;height:150px}.product-brand-logo{width:80px;height:80px}}
          </style>'''
              s = s.replace('</head>', css + '</head>', 1)

          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/install-refined-logo.yml').unlink()

      - name: Commit refined logo placement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/install-refined-logo.yml
          git diff --cached --quiet || git commit -m "Install refined MalGuard logo system"
          git push
