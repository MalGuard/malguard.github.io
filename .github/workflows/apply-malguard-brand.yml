name: Apply MalGuard brand system

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-brand:
    if: ${{ !contains(github.event.head_commit.message, '[brand-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply real MalGuard logo and gaming typography
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_font = 'https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap'
          new_font = 'https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap'
          s = s.replace(old_font, new_font)

          css_anchor = '.radar-node{'
          css = r''' .hero-logo{position:absolute;left:50%;top:50%;width:178px;height:196px;transform:translate(-50%,-50%);z-index:20;display:grid;place-items:center;pointer-events:none;filter:drop-shadow(0 0 5px rgba(0,0,0,.95)) drop-shadow(0 0 18px rgba(0,229,255,.22))}.hero-logo img{width:100%;height:100%;object-fit:contain}.hero-logo:after{content:"";position:absolute;inset:5%;border:1px solid rgba(154,234,255,.18);clip-path:polygon(50% 0,90% 15%,90% 57%,80% 76%,50% 100%,20% 76%,10% 57%,10% 15%);box-shadow:inset 0 0 22px rgba(0,229,255,.06);pointer-events:none}
          .brand-name{display:block;font:900 13px/1 var(--display);letter-spacing:.055em;transform:skewX(-4deg);background:linear-gradient(180deg,#fff 5%,#9aeaff 46%,#43bfff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 18px rgba(0,229,255,.12)}
          .product-icon.logo{padding:7px}.product-icon.logo img{width:100%;height:100%;object-fit:contain}
          .product-page-brand{width:96px;height:108px;margin:0 0 22px}.product-page-brand img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 16px rgba(0,229,255,.2))}
          h1,.section-title,.product-page-header h1{letter-spacing:-.025em;text-rendering:geometricPrecision}
          @media(max-width:760px){.hero-logo{width:128px;height:145px}.brand-name{font-size:12px}.brand-mark{width:34px;height:38px}}
          '''
          if '.hero-logo{' not in s:
              s = s.replace(css_anchor, css + css_anchor, 1)

          old_brand = '<svg class="brand-mark" viewBox="0 0 100 116" aria-hidden="true"><path d="M50 3 91 18v40c0 25-16 43-41 54C25 101 9 83 9 58V18Z" fill="#080c10" stroke="#9aeaff" stroke-width="3"/><path d="m25 72 10-39 15 19 15-19 10 39-12-6-13 12-13-12Z" fill="none" stroke="#00e5ff" stroke-width="6" stroke-linejoin="round"/><path d="M22 16h56" stroke="#ff2bd6" stroke-width="2" opacity=".75"/></svg><span class="brand-word">MALGUARD<small>GAMING SECURITY</small></span>'
          new_brand = '<img class="brand-mark" src="assets/malguard-logo.svg" alt="MalGuard logo"><span class="brand-word"><span class="brand-name">MALGUARD</span><small>GAMING SECURITY</small></span>'
          if old_brand in s:
              s = s.replace(old_brand, new_brand, 1)

          old_shield = '<div class="shield"><div class="shield-shell"></div><div class="shield-shape"></div><div class="shield-inner"></div><div class="m-core"><span>M</span></div></div>'
          new_shield = '<div class="hero-logo"><img src="assets/malguard-logo.svg" alt="MalGuard gaming security logo"></div>'
          if old_shield in s:
              s = s.replace(old_shield, new_shield, 1)

          old_gta_icon = '<div class="product-icon">G</div><div class="product-status">AVAILABLE</div><h3>GTA Guard</h3>'
          new_gta_icon = '<div class="product-icon logo"><img src="assets/malguard-logo.svg" alt="MalGuard logo"></div><div class="product-status">AVAILABLE</div><h3>GTA Guard</h3>'
          s = s.replace(old_gta_icon, new_gta_icon, 1)

          gta_header = '<div class="product-page-header"><button class="back-button" onclick="showHome()">← Back to MalGuard</button><div class="product-hero-status">AVAILABLE PRODUCT</div>'
          gta_header_new = '<div class="product-page-header"><button class="back-button" onclick="showHome()">← Back to MalGuard</button><div class="product-page-brand"><img src="assets/malguard-logo.svg" alt="MalGuard logo"></div><div class="product-hero-status">AVAILABLE PRODUCT</div>'
          s = s.replace(gta_header, gta_header_new, 1)

          old = '<div class="product-page-header"><button class="back-button" onclick="showHome()">← Back to MalGuard</button><div class="product-hero-status coming">COMING SOON</div>'
          new = '<div class="product-page-header"><button class="back-button" onclick="showHome()">← Back to MalGuard</button><div class="product-page-brand"><img src="assets/malguard-logo.svg" alt="MalGuard logo"></div><div class="product-hero-status coming">COMING SOON</div>'
          s = s.replace(old, new)

          p.write_text(s, encoding='utf-8')

      - name: Commit brand implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f .github/workflows/apply-malguard-brand.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply MalGuard logo and gaming brand system [brand-applied]"
          git push
