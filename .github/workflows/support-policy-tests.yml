name: Support Agent policy checks
on:
  pull_request:
    paths:
      - 'services/support/**'
      - 'tests/support-*.test.mjs'
      - '.github/workflows/support-policy-tests.yml'
      - 'functions/api/support/**'
      - 'assets/support-agent.js'
      - 'assets/support-attachments-ui.mjs'
      - 'assets/support-agent.css'
      - 'support-ticket.html'
      - 'tests/support-browser.mjs'
      - 'tests/support-admin-browser.mjs'
      - 'support-admin.html'
      - 'assets/support-admin.js'
permissions:
  contents: read

jobs:
  support-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify source syntax
        run: |
          node --check services/support/server/ticket-policy.mjs
          node --check services/support/server/email-link.mjs
          node --check services/support/server/support-store.mjs
          node --check services/support/server/support-identity.mjs
          node --check services/support/server/support-mail.mjs
          node --check services/support/server/support-http.mjs
          node --check services/support/server/support-admin.mjs
          node --check services/support/server/support-attachments.mjs
          node --check services/support/server/support-attachment-store.mjs
          node --check services/support/server/support-upload.mjs
          node --check services/support/server/support-model.mjs
          node --check services/support/server/support-triage.mjs
          node --check services/support/cloudflare/ticket-api.mjs
          node --input-type=module --check < functions/api/support/auth/password.js
          node --check services/support/server/support-review.mjs
          node --input-type=module --check < functions/api/support/status.js
          node --input-type=module --check < 'functions/api/support/[endpoint].js'
          node --check assets/support-agent.js
          node --check assets/support-admin.js
          node --check tests/support-admin-browser.mjs
          node --check assets/support-privacy.mjs
          node --check assets/support-attachments-ui.mjs
          node --check tests/support-browser.mjs
          node --check api/support-cleanup.js
          node --check api/support.js
      - name: Run Support Agent foundation tests
        run: node --test tests/support-ticket-policy.test.mjs tests/support-email-link.test.mjs tests/support-http.test.mjs tests/support-identity.test.mjs tests/support-store.test.mjs tests/support-privacy.test.mjs tests/support-attachments.test.mjs tests/support-admin.test.mjs tests/support-model.test.mjs tests/support-review.test.mjs tests/support-triage.test.mjs tests/support-cloudflare-status.test.mjs tests/support-cloudflare-ticket.test.mjs

      - name: Install UI dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test support chat and RTL browser flows
        env:
          TEST_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: |
          node tests/support-browser.mjs
          node tests/support-admin-browser.mjs
