name: Verify live installer download
on:
  push:
    branches: [main]
    paths: ['private-download-service/**', 'release/**', 'tests/verify-password-production.mjs', 'tests/verify-public-production.mjs', '.github/workflows/password-download-validation.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  live-password-download:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify public download or explicitly gated release
        env:
          WORKFLOW_TOKEN: ${{ github.token }}
        run: |
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$WORKFLOW_TOKEN" | base64 -w0)"
          if node -e "process.exit(JSON.parse(require('fs').readFileSync('release/malguard-current-release.json')).status === 'public-download-ready' ? 0 : 1)"; then
            node tests/verify-public-production.mjs
          else
            node tests/verify-password-production.mjs
          fi
