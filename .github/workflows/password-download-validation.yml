name: Verify live password-only installer download
on:
  push:
    branches: [main]
    paths: ['private-download-service/**', 'release/malguard-current-release.json', 'tests/verify-password-production.mjs', '.github/workflows/password-download-validation.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  live-password-download:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify published server using an ephemeral private recipient
        env:
          WORKFLOW_TOKEN: ${{ github.token }}
        run: |
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$WORKFLOW_TOKEN" | base64 -w0)"
          node tests/verify-password-production.mjs
