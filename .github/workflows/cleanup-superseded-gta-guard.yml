name: Remove superseded GTA Guard releases

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-superseded-gta-guard.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      CURRENT_TAG: gta-guard-v0.7.0-beta.1-e37bf3b
    steps:
      - name: Verify current GTA Guard release exists
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$CURRENT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Delete superseded GTA Guard preview releases
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tags < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName')
          for tag in "${tags[@]}"; do
            if [[ "$tag" =~ ^gta-guard-v0\.6\.1-beta\.1-[a-f0-9]{7}$ ]] || [[ "$tag" == "downloads-v0.6.1-beta.1" ]]; then
              echo "Deleting superseded release: $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            fi
          done

      - name: Confirm only current GTA Guard preview remains
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t gta_tags < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName | select(startswith("gta-guard-v"))')
          test "${#gta_tags[@]}" -eq 1
          test "${gta_tags[0]}" = "$CURRENT_TAG"
          if gh release view downloads-v0.6.1-beta.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Old counted release still exists."
            exit 1
          fi
