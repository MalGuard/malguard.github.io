name: Visual reference audit
on:
  push:
    branches: [design/security-motion-20261001]
permissions:
  contents: read
jobs:
  reference-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Inspect current website and public visual references
        run: node tests/reference-audit.mjs
      - name: Save reference evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visual-reference-audit
          path: reference-results/
          retention-days: 7
