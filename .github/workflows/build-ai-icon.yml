name: Build MalGuard AI install icon
on:
  push:
    branches: [main]
    paths:
      - ai/icon-art.svg
      - .github/workflows/build-ai-icon.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render original product art as iOS PNG
        run: |
          python -m pip install --disable-pip-version-check cairosvg pillow
          python - <<'PY'
          import io
          from pathlib import Path
          import cairosvg
          from PIL import Image
          svg = Path('ai/icon-art.svg').read_bytes()
          image = Image.open(io.BytesIO(cairosvg.svg2png(bytestring=svg, output_width=512, output_height=512))).convert('RGB')
          image.resize((180, 180), Image.Resampling.LANCZOS).save('ai/apple-touch-icon.png', optimize=True)
          image.resize((192, 192), Image.Resampling.LANCZOS).save('ai/icon-192.png', optimize=True)
          image.save('ai/icon-512.png', optimize=True)
          PY
      - name: Commit generated app icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai/apple-touch-icon.png ai/icon-192.png ai/icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Render MalGuard AI icons from original product artwork"
            git push
          fi
