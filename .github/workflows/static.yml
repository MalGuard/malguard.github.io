# Deploy only approved production web assets to GitHub Pages.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build production artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/.well-known

          cp index.html 404.html _site/
          cp tools.html trust.html privacy.html support.html about.html labs.html docs.html download.html scan-mods.html ai-intelligence.html scan-url.html products.html gta-guard.html _site/
          cp robots.txt sitemap.xml _site/
          cp favicon.ico favicon-96.png favicon-192.png _site/
          cp -R assets _site/assets
          cp -R downloads _site/downloads
          cp -R ios-preview _site/ios-preview
          cp -R research _site/research
          cp .well-known/security.txt _site/.well-known/security.txt

          # Guardrail: development prototypes must never ship in the Pages artifact.
          test ! -e _site/agent-runtime-test-v1
          test ! -e _site/malware-ai-preview-v02
          test -f _site/.well-known/security.txt
          test -f _site/tools.html
          test -f _site/trust.html
          test -f _site/docs.html
          test -f _site/download.html
          test -f _site/scan-mods.html
          test -f _site/ai-intelligence.html
          test -f _site/scan-url.html
          test -f _site/products.html
          test -f _site/gta-guard.html
          test -f _site/research/repackaged-mod.html

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
