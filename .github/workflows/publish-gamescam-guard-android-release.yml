name: Publish GameScam Guard Android Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-signed-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gamescam-guard-android
    env:
      RELEASE_TAG: gamescam-guard-android-v1.1.0
      RELEASE_ASSET: GameScam-Guard-1.1.0-android.apk
      GSG_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.GSG_ANDROID_KEYSTORE_PASSWORD }}
      GSG_ANDROID_KEY_ALIAS: ${{ secrets.GSG_ANDROID_KEY_ALIAS }}
      GSG_ANDROID_KEY_PASSWORD: ${{ secrets.GSG_ANDROID_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore private release signing key
        env:
          GSG_ANDROID_KEYSTORE_BASE64: ${{ secrets.GSG_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$GSG_ANDROID_KEYSTORE_BASE64"
          test -n "$GSG_ANDROID_KEYSTORE_PASSWORD"
          test -n "$GSG_ANDROID_KEY_ALIAS"
          test -n "$GSG_ANDROID_KEY_PASSWORD"
          keyfile="$RUNNER_TEMP/gamescam-guard-release.jks"
          printf '%s' "$GSG_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          test -s "$keyfile"
          printf 'GSG_ANDROID_KEYSTORE_PATH=%s\n' "$keyfile" >> "$GITHUB_ENV"
      - name: Install Android platform
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --licenses > /dev/null
          set -o pipefail
          "$sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          printf 'sdk.dir=%s\n' "$sdk_root" > local.properties
          printf 'ANDROID_SDK_ROOT=%s\n' "$sdk_root" >> "$GITHUB_ENV"
      - name: Build signed release APK
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Verify release signature
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
      - name: Publish signed release asset
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "GameScam Guard Android 1.1.0" --notes "Signed Android 8.0+ direct-install release."
          fi
          release_apk="$RUNNER_TEMP/$RELEASE_ASSET"
          cp "$apk" "$release_apk"
          gh release delete-asset "$RELEASE_TAG" app-release.apk --yes --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || true
          gh release upload "$RELEASE_TAG" "$release_apk" --clobber --repo "$GITHUB_REPOSITORY"
