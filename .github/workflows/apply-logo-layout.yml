name: Apply MalGuard logo layout

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply logo layout
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('src="assets/malguard-logo.svg" alt="MalGuard logo"', 'src="assets/malguard-site-logo.svg" alt="MalGuard logo"')
          s = s.replace('src="assets/malguard-logo.svg" alt="MalGuard gaming security logo"', 'src="assets/malguard-shield.svg" alt="MalGuard gaming security logo"')

          s = s.replace('<div class="product-icon">G</div>', '<div class="product-icon"><img src="assets/malguard-shield.svg" alt="GTA Guard"></div>')
          s = s.replace('<div class="product-icon">M</div>', '<div class="product-icon"><img src="assets/malguard-shield.svg" alt="Minecraft Mod Guard"></div>')
          s = s.replace('<div class="product-icon">S</div>', '<div class="product-icon"><img src="assets/malguard-shield.svg" alt="Game Scam Guard"></div>')

          s = s.replace('<div class="product-page-header"><button', '<div class="product-page-header"><img class="product-brand-logo" src="assets/malguard-shield.svg" alt="MalGuard"><button')

          marker = '.product-card.available .product-link{color:var(--green)}'
          css = marker + '.product-icon img{width:34px;height:38px;object-fit:contain;filter:drop-shadow(0 0 7px rgba(0,180,255,.28))}.product-brand-logo{width:88px;height:100px;object-fit:contain;display:block;margin-bottom:18px;filter:drop-shadow(0 0 14px rgba(0,180,255,.2))}'
          if '.product-brand-logo{' not in s:
              s = s.replace(marker, css)

          p.write_text(s, encoding='utf-8')

      - name: Commit layout changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Use MalGuard logo variants across site and product pages"
            git push
          fi
