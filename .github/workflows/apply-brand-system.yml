name: Apply MalGuard brand system

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  brand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply logo variants to site
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # The navbar and radar both use the same timeless three-prong core mark.
          s = s.replace('assets/malguard-site-logo.svg', 'assets/malguard-logo.svg')
          s = s.replace('assets/malguard-shield.svg', 'assets/malguard-logo.svg')

          # Replace the old text-only product icons with the branded mark.
          s = re.sub(
              r'<(?:span|div) class="product-icon">(?:G|M|S)</(?:span|div)>',
              '<div class="product-icon"><img src="assets/malguard-logo.svg" alt="MalGuard"></div>',
              s,
          )

          # Give product/document headers a reusable logo treatment when present.
          marker = '.product-brand-logo{'
          if marker not in s:
              s = s.replace('</style>', '.product-brand-logo{width:76px;height:76px;object-fit:contain;display:block;margin-bottom:16px}.document-brand-logo{width:58px;height:58px;object-fit:contain;display:block}\n</style>', 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/malguard-logo.svg assets/malguard-app.svg assets/malguard-document.svg
          git diff --cached --quiet || git commit -m "Apply MalGuard brand system to site"
          git push
