name: Publish counted Windows download

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-counted-windows-download.yml'
      - 'downloads/MalGuard-Setup-0.6.1-beta.1-windows-x64.exe'
      - 'downloads/MalGuard-Setup-0.6.1-beta.1-windows-x64.exe.sha256'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: downloads-v0.6.1-beta.1
      EXE: downloads/MalGuard-Setup-0.6.1-beta.1-windows-x64.exe
      SUM: downloads/MalGuard-Setup-0.6.1-beta.1-windows-x64.exe.sha256
      BEACON: MalGuard-install-beacon-0.6.1-beta.1-windows-x64.txt
      EXPECTED_SHA256: 671d38e17a9a2dbd5f77aa95f7da4c104c1dac4d9e5ed477a3309e321291bf0b
      SOURCE_COMMIT: fabf1bf3dd3d96dbeaaa33a788dcb4de2959555c

    steps:
      - name: Checkout exact website source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify exact production installer
        shell: bash
        run: |
          set -euo pipefail
          test -f "$EXE"
          test -f "$SUM"
          actual="$(sha256sum "$EXE" | awk '{print $1}')"
          declared="$(awk '{print $1}' "$SUM")"
          test "$actual" = "$EXPECTED_SHA256"
          test "$declared" = "$EXPECTED_SHA256"

      - name: Create privacy-preserving install beacon asset
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n'             'MalGuard anonymous first-successful-launch counter beacon.'             'This file contains no user or device identifier.'             "Version: 0.6.1-beta.1"             "Architecture: windows-x64"             > "$BEACON"

      - name: Create immutable counted download release if needed
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG"               --repo "$GITHUB_REPOSITORY"               --prerelease               --title "MalGuard Windows 0.6.1-beta.1 counted download"               --notes "Official counted mirror of the current MalGuard Windows x64 unsigned preview. Source commit: $SOURCE_COMMIT. SHA-256: $EXPECTED_SHA256."
          fi

      - name: Upload missing counted assets without replacing existing ones
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for file in "$EXE" "$SUM" "$BEACON"; do
            name="$(basename "$file")"
            if grep -Fxq "$name" <<<"$existing"; then
              echo "Asset already exists and will not be replaced: $name"
            else
              gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY"
            fi
          done
