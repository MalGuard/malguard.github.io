name: Install Google favicon

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  favicon:
    if: ${{ !contains(github.event.head_commit.message, 'Install Google favicon assets') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PNG and ICO favicons
        run: |
          python -m pip install --quiet cairosvg pillow
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          from PIL import Image

          svg = Path('assets/malguard-logo.svg')
          cairosvg.svg2png(url=str(svg), write_to='favicon-96.png', output_width=96, output_height=96)
          cairosvg.svg2png(url=str(svg), write_to='favicon-192.png', output_width=192, output_height=192)

          img = Image.open('favicon-192.png').convert('RGBA')
          img.save('favicon.ico', format='ICO', sizes=[(16,16),(32,32),(48,48)])

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<link rel="icon" type="image/svg+xml" href="assets/malguard-logo.svg">'
          new = '''<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png">\n<link rel="shortcut icon" href="/favicon.ico">\n<link rel="apple-touch-icon" sizes="192x192" href="/favicon-192.png">'''
          if old in s:
              s = s.replace(old, new, 1)
          elif '/favicon-96.png' not in s:
              s = s.replace('</title>', '</title>\n' + new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit favicon assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add favicon-96.png favicon-192.png favicon.ico index.html
          git diff --cached --quiet || git commit -m "Install Google favicon assets"
          git push
