          $build = $env:CORE_SHA.Substring(0,7)
          $releasedAt = (Get-Date).ToUniversalTime().ToString('o')
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG"
          $metadata = [ordered]@{
            schemaVersion = '1.0.0'
            product = 'GTA Guard'
            platform = 'windows-x64'
            version = $version
            build = $build
            sourceCommit = $env:CORE_SHA
            releasedAt = $releasedAt
            installer = [ordered]@{
              name = $env:PUBLISH_EXE
              url = "$base/$env:PUBLISH_EXE"
              sha256 = $sha256
              sha256Url = "$base/$env:PUBLISH_SUM"
            }
          } | ConvertTo-Json -Depth 5
          $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($metadata + "`n"))
          $path = 'release/gta-guard-windows.json'
          $current = gh api "repos/$env:GITHUB_REPOSITORY/contents/$path?ref=main" --jq '.sha'
          if ($LASTEXITCODE -ne 0 -or -not $current) { throw 'could not read current release metadata blob' }
          $request = [ordered]@{
            message = "Publish GTA Guard Windows release metadata for build $build"
            content = $encoded
            sha = $current.Trim()
            branch = 'main'
          } | ConvertTo-Json
          $requestPath = Join-Path $env:RUNNER_TEMP 'gta-guard-release-metadata.json'
          Set-Content -LiteralPath $requestPath -Value $request -Encoding UTF8
          gh api --method PUT "repos/$env:GITHUB_REPOSITORY/contents/$path" --input $requestPath | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'failed to publish website release metadata' }
