name: Pause GTA Guard public release assets

on:
  push:
    branches: ["main"]
    paths:
      - "release/gta-guard-windows.json"
      - ".github/workflows/pause-gta-guard-public-download.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-public-installers:
    runs-on: ubuntu-latest
    steps:
      - name: Remove GTA Guard installer assets from public releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mapfile -t release_ids < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.tag_name | startswith("gta-guard-v")) | .id'
          )

          for release_id in "${release_ids[@]}"; do
            mapfile -t asset_ids < <(
              gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
                --jq '.[] | select(.name | test("^MalGuard-Setup-.*-windows-x64\\.exe(?:\\.sha256)?$")) | .id'
            )
            for asset_id in "${asset_ids[@]}"; do
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            done
          done

          remaining="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.tag_name | startswith("gta-guard-v")) | .id' |
            while read -r release_id; do
              gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
                --jq '.[] | select(.name | test("^MalGuard-Setup-.*-windows-x64\\.exe(?:\\.sha256)?$")) | .name'
            done
          )"

          if [[ -n "${remaining}" ]]; then
            echo "GTA Guard installer assets still public:"
            echo "${remaining}"
            exit 1
          fi

          echo "No public GTA Guard Windows installer assets remain in gta-guard-v* releases."
