plugins {
    id 'com.android.application'
}

android {
    namespace 'site.malguard.gamescamguard'
    compileSdk 35

    defaultConfig {
        applicationId 'site.malguard.gamescamguard'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    def releaseStorePath = System.getenv('GSG_ANDROID_KEYSTORE_PATH')
    def releaseStorePassword = System.getenv('GSG_ANDROID_KEYSTORE_PASSWORD')
    def releaseKeyAlias = System.getenv('GSG_ANDROID_KEY_ALIAS')
    def releaseKeyPassword = System.getenv('GSG_ANDROID_KEY_PASSWORD')
    def hasReleaseSigning = [releaseStorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && !it.isBlank() }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
