<!doctype html>
<html lang="en" dir="ltr"><head><script src="./agent-legacy-entry.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b091c"><link rel="canonical" href="https://malguard.site/ai/"><title>MalGuard AI</title><link rel="icon" href="./agent/mark.webp"><link rel="stylesheet" href="./agent/studio.css"><script defer src="./agent/studio.js"></script></head>
<body>
<button class="backdrop" aria-label="Close sidebar"></button>
<aside id="sidebar">
<header><img src="./agent/mark.webp" alt=""><strong>MalGuard AI</strong><button class="icon" data-action="sidebar" aria-label="Collapse sidebar"><i data-icon="panel"></i></button></header>
<button class="new" data-action="new"><i data-icon="plus"></i> New Chat</button>
<div class="recent-title"><i data-icon="clock"></i> Recent Chats</div>
<nav id="recent" aria-label="Recent chats"></nav>
<div class="side-bottom"><section class="pro"><strong><i data-icon="crown"></i> Upgrade to Pro</strong><p>Unlock higher limits, advanced models, and premium features.</p><button data-action="pro">Upgrade Now <i data-icon="arrow"></i></button></section>
<button class="side-link" data-action="settings"><i data-icon="settings"></i>Settings</button><button class="side-link" data-action="help"><i data-icon="help"></i>Help &amp; Support</button></div></aside>
<main><div class="utils"><button class="circle menu" data-action="sidebar" aria-label="Open sidebar"><i data-icon="panel"></i></button><span></span><button class="circle" data-action="search" aria-label="Search chats"><i data-icon="search"></i></button><button class="circle bell" data-action="activity" aria-label="Activity"><i data-icon="bell"></i></button><button class="circle account" data-action="account" aria-label="MalGuard account"><i data-icon="user"></i></button></div>
<div class="surface">
<section class="welcome"><img class="hero-brand" src="./agent/hero-brand.webp" alt="MalGuard AI"><h1>How can I help you <em>today?</em></h1><p>A powerful, secure, and multimodal AI assistant for work, research, and creation.</p></section>
<section class="cards" aria-label="Start a project"></section>
<section id="conversation" hidden aria-label="Conversation" aria-live="polite"></section>
<form id="composer"><label for="prompt" class="sr">Message MalGuard AI</label><textarea dir="auto" id="prompt" maxlength="4200" rows="2" placeholder="Message MalGuard AI..." required></textarea>
<div class="toolbar"><button type="button" class="tool add" data-action="tools" aria-label="More tools"><i data-icon="plus"></i></button><button type="button" class="tool" data-action="model"><img class="mini" src="./agent/mark.webp" alt=""> <b>MalGuard Ultra 1.5</b><i data-icon="chevron"></i></button><button type="button" class="tool" data-action="web"><i data-icon="globe"></i>Web Search <span class="toggle" aria-hidden="true"></span></button><button type="button" class="tool" data-action="tools"><i data-icon="grid"></i>Tools<i data-icon="chevron"></i></button><button type="button" class="tool" data-action="attach"><i data-icon="clip"></i>Attach</button><button type="submit" class="send" aria-label="Send message"><i data-icon="send"></i></button></div>
<input type="file" id="file" accept=".txt,.md,.csv,.json,.html,.css,.js" hidden></form>
<p id="notice" role="status" hidden></p><div class="quick"></div>
</div></main>
<dialog id="dialog"><button class="close icon" aria-label="Close dialog"><i data-icon="x"></i></button><h2></h2><div id="dialogBody"></div></dialog>
</body></html>
