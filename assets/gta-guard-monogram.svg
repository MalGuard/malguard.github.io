<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
<title>GTA Guard</title>
<defs>
  <linearGradient id="shield" x1="76" y1="480" x2="438" y2="52" gradientUnits="userSpaceOnUse">
    <stop stop-color="#061743"/><stop offset="1" stop-color="#164eac"/>
  </linearGradient>
  <linearGradient id="letters" x1="120" y1="384" x2="390" y2="136" gradientUnits="userSpaceOnUse">
    <stop stop-color="#09aef5"/><stop offset=".55" stop-color="#14d6f4"/><stop offset="1" stop-color="#4df8e9"/>
  </linearGradient>
  <filter id="letterGlow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="3" result="soft"/><feMerge><feMergeNode in="soft"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .mark-letters{animation:gtaPulse 3.6s ease-in-out infinite;transform-origin:256px 256px}
    @keyframes gtaPulse{0%,58%,100%{filter:none;opacity:.88}72%,84%{filter:url(#letterGlow);opacity:1}}
    @media (prefers-reduced-motion:reduce){.mark-letters{animation:none;opacity:1}}
  </style>
</defs>
