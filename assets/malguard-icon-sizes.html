<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">

<!-- Apple Touch Icon -->
<link rel="apple-touch-icon" href="/assets/malguard-icon-180.png">

<!-- Android Chrome Icons -->
<link rel="icon" type="image/png" sizes="48x48" href="/assets/malguard-icon-48.png">
<link rel="icon" type="image/png" sizes="96x96" href="/assets/malguard-icon-96.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/malguard-icon-192.png">

<!-- Microsoft Tile -->
<meta name="msapplication-TileImage" content="/assets/malguard-icon-144.png">
