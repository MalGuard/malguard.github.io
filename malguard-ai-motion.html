<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MalGuard AI | Motion concept</title><meta name="robots" content="noindex"><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#080b11;color:#e8eef6;font:16px/1.6 system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.wrap{width:min(100%,820px)}h1{font-size:clamp(28px,5vw,46px);margin:0 0 4px}.eyebrow{font-size:12px;letter-spacing:.22em;color:#9fb1c6}.description{color:#b7c5d6;margin:0 0 20px}.stage{position:relative;overflow:hidden;isolation:isolate;border:1px solid #2b3b50;border-radius:24px;background:radial-gradient(ellipse at 50% 55%,#15293d 0%,#0b111b 52%,#070a10 100%);height:clamp(300px,55vw,460px)}.stage:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#fff1 1px,transparent 1px),linear-gradient(90deg,#fff1 1px,transparent 1px);background-size:42px 42px;mask-image:radial-gradient(ellipse,#0007,transparent 72%)}.brand{position:absolute;left:50%;top:50%;width:clamp(90px,18vw,140px);height:clamp(90px,18vw,140px);margin-left:calc(clamp(90px,18vw,140px)/-2);margin-top:calc(clamp(90px,18vw,140px)/-2);display:grid;place-items:center;border:1px solid #9db4d744;border-radius:24px;background:#101925ee;box-shadow:0 14px 45px #0009;will-change:transform,opacity}.brand img{width:64%;height:64%;object-fit:contain}.brand.openai{animation:join-left 8s ease-in-out infinite}.brand.claude{animation:join-top 8s ease-in-out infinite}.brand.grok{animation:join-right 8s ease-in-out infinite}.brand.malguard{opacity:0;animation:reveal 8s ease-in-out infinite;border-color:#83d7b377;box-shadow:0 0 60px #65c9aa25;background:#12221e}.flash{position:absolute;left:50%;top:50%;width:12px;height:12px;border-radius:50%;background:#9aeacb;filter:blur(3px);transform:translate(-50%,-50%) scale(0);animation:flash 8s ease-in-out infinite}.note{color:#9aaec2;font-size:12px;margin:14px 0}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.controls button,.controls a{background:#162233;border:1px solid #3c526c;color:#e8eef6;border-radius:10px;padding:10px 14px;text-decoration:none;cursor:pointer}.stage.paused *{animation-play-state:paused!important}@keyframes join-left{0%,8%{transform:translate(-165%,8%);opacity:0}15%,40%{transform:translate(-125%,-8%);opacity:1}27%{transform:translate(-125%,5%)}52%{transform:translate(-70%,0)}62%{transform:translate(0,0) scale(.6);opacity:1}68%,100%{transform:translate(0,0) scale(.25);opacity:0}}@keyframes join-top{0%,8%{transform:translate(0,-160%);opacity:0}15%,40%{transform:translate(0,-115%);opacity:1}27%{transform:translate(0,-128%)}52%{transform:translate(0,-60%)}62%{transform:translate(0,0) scale(.6);opacity:1}68%,100%{transform:translate(0,0) scale(.25);opacity:0}}@keyframes join-right{0%,8%{transform:translate(165%,8%);opacity:0}15%,40%{transform:translate(125%,8%);opacity:1}27%{transform:translate(125%,-5%)}52%{transform:translate(70%,0)}62%{transform:translate(0,0) scale(.6);opacity:1}68%,100%{transform:translate(0,0) scale(.25);opacity:0}}@keyframes reveal{0%,62%{transform:scale(.4);opacity:0}70%,87%{transform:scale(1);opacity:1}95%,100%{transform:scale(.8);opacity:0}}@keyframes flash{0%,59%,74%,100%{transform:translate(-50%,-50%) scale(0);opacity:0}65%{transform:translate(-50%,-50%) scale(12);opacity:.8}}@media(max-width:540px){.brand{width:82px;height:82px;margin:-41px 0 0 -41px;border-radius:17px}@keyframes join-left{0%,8%{transform:translate(-150%,8%);opacity:0}15%,40%{transform:translate(-115%,-8%);opacity:1}27%{transform:translate(-115%,5%)}52%{transform:translate(-65%,0)}62%{transform:translate(0,0) scale(.6);opacity:1}68%,100%{transform:scale(.25);opacity:0}}@keyframes join-right{0%,8%{transform:translate(150%,8%);opacity:0}15%,40%{transform:translate(115%,8%);opacity:1}27%{transform:translate(115%,-5%)}52%{transform:translate(65%,0)}62%{transform:translate(0,0) scale(.6);opacity:1}68%,100%{transform:scale(.25);opacity:0}}}@media(prefers-reduced-motion:reduce){.brand,.flash{animation:none!important}.brand:not(.malguard){display:none}.brand.malguard{opacity:1;transform:none}.flash{display:none}}</style></head><body><main class="wrap"><p class="eyebrow">MALGUARD / MOTION CONCEPT</p><h1>MalGuard AI</h1><p class="description">Three visual references. One MalGuard identity.</p><div class="stage" id="stage" role="img" aria-label="Decorative animation of ChatGPT, Claude and Grok logos converging, followed by the MalGuard logo"><div class="brand openai"><img src="/assets/precision/provider-openai.svg" alt=""></div><div class="brand claude"><img src="/assets/precision/provider-claude.svg" alt=""></div><div class="brand grok"><img src="/assets/precision/provider-grok.svg" alt=""></div><div class="flash"></div><div class="brand malguard"><img src="/assets/fusion/assets/malguard-logo.svg" alt=""></div></div><p class="note">Visual concept only. No provider affiliation, integration, or merger is implied.</p><div class="controls"><button type="button" id="pause" aria-pressed="false">Pause animation</button><a href="/">Back to MalGuard</a></div></main><script>const stage=document.getElementById('stage'),btn=document.getElementById('pause');btn.addEventListener('click',()=>{const paused=stage.classList.toggle('paused');btn.textContent=paused?'Play animation':'Pause animation';btn.setAttribute('aria-pressed',String(paused))})</script><script type="module" src="/assets/i18n.mjs"></script></body></html>
