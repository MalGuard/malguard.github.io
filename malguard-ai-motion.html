<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MalGuard AI | Motion concept</title><meta name="robots" content="noindex"><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#080b11;color:#e8eef6;font:16px/1.6 system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.wrap{width:min(100%,820px)}h1{font-size:clamp(28px,5vw,46px);margin:0 0 4px}.eyebrow{font-size:12px;letter-spacing:.22em;color:#9fb1c6}.description{color:#b7c5d6;margin:0 0 20px}.stage{position:relative;overflow:hidden;isolation:isolate;border:1px solid #2b3b50;border-radius:24px;background:radial-gradient(ellipse at 50% 55%,#15293d 0%,#0b111b 52%,#070a10 100%);height:clamp(300px,55vw,460px)}.stage:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#fff1 1px,transparent 1px),linear-gradient(90deg,#fff1 1px,transparent 1px);background-size:42px 42px;mask-image:radial-gradient(ellipse,#0007,transparent 72%)}.brand{position:absolute;left:50%;top:50%;width:clamp(76px,14vw,116px);height:clamp(76px,14vw,116px);margin-left:calc(clamp(76px,14vw,116px)/-2);margin-top:calc(clamp(76px,14vw,116px)/-2);display:grid;place-items:center;will-change:transform,opacity;filter:drop-shadow(0 8px 12px #0008)}.brand img{width:100%;height:100%;object-fit:contain}.brand.openai{animation:bounce-left 7.2s linear infinite}.brand.claude{animation:bounce-top 7.2s linear infinite}.brand.grok{animation:bounce-right 7.2s linear infinite}.brand.malguard{opacity:0;animation:form-mark 7.2s ease-in-out infinite;filter:drop-shadow(0 0 24px #5ac5ff99)}.flash{position:absolute;left:50%;top:50%;width:12px;height:12px;border-radius:50%;background:#9aeacb;filter:blur(3px);transform:translate(-50%,-50%) scale(0);animation:flash 8s ease-in-out infinite}.note{color:#9aaec2;font-size:12px;margin:14px 0}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.controls button,.controls a{background:#162233;border:1px solid #3c526c;color:#e8eef6;border-radius:10px;padding:10px 14px;text-decoration:none;cursor:pointer}.stage.paused *{animation-play-state:paused!important}@keyframes bounce-left{0%{transform:translate(-350%,-140%) scale(.75);opacity:0}8%{transform:translate(-220%,-10%) scale(1);opacity:1}12%{transform:translate(-195%,-52%)}17%{transform:translate(-165%,-10%)}21%{transform:translate(-145%,-32%)}26%,48%{transform:translate(-125%,-10%)}53%{transform:translate(-125%,-32%)}58%{transform:translate(-105%,-10%)}65%{transform:translate(0,0) scale(.65);opacity:1}69%,100%{transform:translate(0,0) scale(.1);opacity:0}}@keyframes bounce-top{0%{transform:translate(0,-330%) scale(.75);opacity:0}8%{transform:translate(0,-175%) scale(1);opacity:1}12%{transform:translate(0,-215%)}17%{transform:translate(0,-145%)}21%{transform:translate(0,-168%)}26%,48%{transform:translate(0,-125%)}53%{transform:translate(0,-145%)}58%{transform:translate(0,-105%)}65%{transform:translate(0,0) scale(.65);opacity:1}69%,100%{transform:translate(0,0) scale(.1);opacity:0}}@keyframes bounce-right{0%{transform:translate(350%,-140%) scale(.75);opacity:0}8%{transform:translate(220%,-10%) scale(1);opacity:1}12%{transform:translate(195%,-52%)}17%{transform:translate(165%,-10%)}21%{transform:translate(145%,-32%)}26%,48%{transform:translate(125%,-10%)}53%{transform:translate(125%,-32%)}58%{transform:translate(105%,-10%)}65%{transform:translate(0,0) scale(.65);opacity:1}69%,100%{transform:translate(0,0) scale(.1);opacity:0}}@keyframes form-mark{0%,65%{transform:scale(.2);opacity:0}71%{transform:scale(1.2);opacity:1}76%,92%{transform:scale(1);opacity:1}100%{transform:scale(.7);opacity:0}}@keyframes flash{0%,62%,76%,100%{transform:translate(-50%,-50%) scale(0);opacity:0}68%{transform:translate(-50%,-50%) scale(16);opacity:.8}}@media(max-width:540px){.brand{width:72px;height:72px;margin:-36px 0 0 -36px}.stage{height:340px}}@media(prefers-reduced-motion:reduce){.brand,.flash{animation:none!important}.brand:not(.malguard){display:none}.brand.malguard{opacity:1;transform:none}.flash{display:none}}</style></head><body><main class="wrap"><p class="eyebrow">MALGUARD / MOTION CONCEPT</p><h1>MalGuard AI</h1><p class="description">Three brands bounce into one MalGuard symbol.</p><div class="stage" id="stage" role="img" aria-label="Decorative animation of ChatGPT, Claude and Grok marks bouncing in from corners, pausing, colliding and forming the MalGuard logo"><div class="brand openai"><img src="/assets/precision/provider-openai.svg" alt=""></div><div class="brand claude"><img src="/assets/precision/provider-claude.svg" alt=""></div><div class="brand grok"><img src="/assets/precision/provider-grok.svg" alt=""></div><div class="flash"></div><div class="brand malguard"><img src="/assets/fusion/assets/malguard-logo.svg" alt=""></div></div><p class="note">Visual concept only. No provider affiliation, integration, or merger is implied.</p><div class="controls"><button type="button" id="pause" aria-pressed="false">Pause animation</button><a href="/">Back to MalGuard</a></div></main><script>const stage=document.getElementById('stage'),btn=document.getElementById('pause');btn.addEventListener('click',()=>{const paused=stage.classList.toggle('paused');btn.textContent=paused?'Play animation':'Pause animation';btn.setAttribute('aria-pressed',String(paused))})</script><script type="module" src="/assets/i18n.mjs"></script></body></html>
